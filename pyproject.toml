[project]
name = "kaggle-knowledge-graph"
version = "0.1.0"
description = "The Python environment for the `kaggle-knowledge-graph` project"
requires-python = ">=3.10,<4.0"
dependencies = [
    "duckdb>=1.5.4",
    "kaggle>=1.7.4.5",
    "polars>=1.42.0",
    "python-dotenv>=1.1.0",
    "tree-sitter>=0.26.0",
    "tree-sitter-python>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest >=8.0.1",
    "pytest-cov >=6.0.0",
    "pytest-mock >=3.14.0",
    "pytest-asyncio >=1.1.0",
    "mypy >=1.11.1",
    "ruff >=0.9.3",
    "pre-commit >=4.2.0",
    "icecream >=2.1.4",
    "mkdocs >=1.6.1",
    "mkdocs-material >=9.6.12",
    "mkdocstrings-python >=1.16.10",
    "pyyaml >=6.0.1",
    "rundoc >=0.2.3",
    "hypothesis >=6.150.2",
    "griffe >=1.7.3",
]

[tool.pytest.ini_options]
pythonpath = ["scripts"]
testpaths = ["tests"]
addopts = [
    "--tb=short",
    #"--disable-warnings",
    "--cov=scripts",
    "--cov-branch",
    "--cov-report=term",
    "--cov-report=xml",
    "-rs"
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"

[tool.coverage.run]
branch = true
parallel = true
source = ["scripts"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = false
skip_empty = true
precision = 2

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_untyped_calls = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_return_any = true
strict_optional = true
warn_redundant_casts = true
exclude = "^(benches/|examples/|tests/|tmp/)"

[tool.ruff]
exclude = [
    ".bzr", ".direnv", ".eggs", ".git", ".git-rewrite", ".hg", ".mypy_cache",
    ".nox", ".pants.d", ".pytype", ".ruff_cache", ".svn", ".tox", ".venv",
    "__pypackages__", "_build", "buck-out", "build", "dist", "node_modules",
    "venv"
]
line-length = 100
indent-width = 4
src = ["scripts"]
target-version = "py310"
unsafe-fixes = false

[tool.ruff.lint]
select = ["ANN", "E", "F", "I", "W", "B", "RUF", "SIM", "C90"]
ignore = ["D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107"]
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = []
